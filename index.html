<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>비상대피 인원점호 실시간 집계 현황</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            alert: {
              50: '#fef2f2',
              500: '#ef4444',
              600: '#dc2626',
              900: '#7f1d1d',
            },
            status: {
              unreported: '#f59e0b',
              missing: '#ef4444',
              complete: '#10b981'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #090e17;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    /* Touch friendly custom scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased pb-20 select-none">

  <!-- Mobile Sticky Top Bar -->
  <header class="sticky top-0 z-40 bg-[#0d1526]/95 backdrop-blur border-b border-slate-800 px-3.5 py-2.5">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <!-- Title & Live Status -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400 flex-shrink-0">
          <i data-lucide="shield-alert" class="w-4 h-4 animate-pulse"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-bold text-white truncate">비상대피 점호 현황판</h1>
            <span id="syncIndicator" class="w-2 h-2 rounded-full bg-emerald-400 animate-ping flex-shrink-0"></span>
          </div>
          <p class="text-[11px] text-slate-400 font-mono truncate">
            경과 T+<span id="incidentTimer" class="text-amber-400 font-bold">00:00</span> • <span id="currentTime">--:--:--</span>
          </p>
        </div>
      </div>

      <!-- Quick Action Controls -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <!-- Mock / Live Mode Toggle -->
        <button id="toggleDemoBtn" class="px-2 py-1 rounded-md text-[11px] font-semibold bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 transition">
          <span id="demoModeLabel">모의 데이터</span>
        </button>

        <!-- Briefing Modal Open -->
        <button id="openBriefingBtn" title="119 인계 브리핑" class="p-1.5 rounded-md bg-amber-500/20 border border-amber-500/30 text-amber-300">
          <i data-lucide="file-text" class="w-4 h-4"></i>
        </button>

        <!-- Config Modal Open -->
        <button id="openSettingsBtn" title="설정" class="p-1.5 rounded-md bg-slate-800 border border-slate-700 text-slate-300">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto w-full px-3 py-3 space-y-3 flex-1">

    <!-- 1. Headcount Rollup Scorecard (핵심 취합 집계) -->
    <div class="bg-gradient-to-br from-slate-900 to-[#111a2e] border border-slate-800 rounded-2xl p-3.5 shadow-lg">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800/80">
        <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
          <i data-lucide="users" class="w-3.5 h-3.5 text-sky-400"></i>
          전사 대피 완료 현황
        </span>
        <span id="reportRatioTag" class="text-[11px] px-2 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
          부서 보고 <span id="statReportedRatio">0 / 19</span>
        </span>
      </div>

      <!-- Main Progress & Big Numbers -->
      <div class="mt-3 flex items-end justify-between">
        <div>
          <div class="text-[11px] text-slate-400">전체 대피율</div>
          <div class="text-3xl font-black text-white tracking-tight flex items-baseline gap-1.5">
            <span id="statOverallRate">0%</span>
            <span class="text-xs font-normal text-slate-400" id="statOverallFraction">(0 / 0명)</span>
          </div>
        </div>
        <!-- Missing Alert Pill -->
        <div class="text-right">
          <div class="text-[11px] text-slate-400">미확인 잔류자</div>
          <div id="statTotalMissing" class="text-xl font-bold text-slate-400">0명</div>
        </div>
      </div>

      <!-- Progress Gauge Bar -->
      <div class="w-full bg-slate-800 h-2.5 rounded-full mt-2.5 overflow-hidden border border-slate-700/60">
        <div id="statOverallBar" class="bg-gradient-to-r from-sky-500 via-indigo-400 to-emerald-400 h-full w-0 transition-all duration-500"></div>
      </div>

      <!-- Sub Counters (Staff vs Visitors/Contractors) -->
      <div class="grid grid-cols-2 gap-2 mt-3 pt-2.5 border-t border-slate-800/60 text-xs">
        <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
          <div class="text-[10px] text-slate-400 flex items-center justify-between">
            <span>임직원 대피</span>
            <span id="statEmpMissingBadge" class="text-[10px] font-bold text-emerald-400">완료</span>
          </div>
          <div class="text-sm font-bold text-slate-200 mt-0.5">
            <span id="statEmpDone" class="text-emerald-400">0</span> / <span id="statEmpTotal">0</span>명
          </div>
        </div>
        <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
          <div class="text-[10px] text-slate-400 flex items-center justify-between">
            <span>협력사·내방객</span>
            <span id="statGuestMissingBadge" class="text-[10px] font-bold text-amber-400">인솔확인</span>
          </div>
          <div class="text-sm font-bold text-slate-200 mt-0.5">
            <span id="statGuestDone" class="text-amber-400">0</span> / <span id="statGuestTotal">0</span>명
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Unreported Departments Warning & Action Card (미보고 부서 전용 알림판) -->
    <div id="unreportedCard" class="bg-amber-950/20 border border-amber-500/40 rounded-2xl p-3 shadow-md space-y-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 text-amber-400 font-bold text-xs">
          <i data-lucide="clock-alert" class="w-4 h-4 animate-pulse text-amber-400"></i>
          <span>아직 미보고된 부서 (<span id="unreportedBadgeCount">0</span>곳)</span>
        </div>
        <button onclick="copyNudgeMessage()" class="px-2 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-[11px] font-medium flex items-center gap-1 transition active:scale-95">
          <i data-lucide="copy" class="w-3 h-3"></i>
          <span>독촉 톡 복사</span>
        </button>
      </div>

      <p class="text-[11px] text-amber-200/80 leading-snug">
        아래 부서는 아직 집결 현황을 제출하지 않았습니다. 단체채팅방을 통해 점호를 재촉하십시오.
      </p>

      <!-- Chips of Unreported Departments -->
      <div id="unreportedListContainer" class="flex flex-wrap gap-1.5 pt-1">
        <!-- Dynamically injected chips -->
      </div>
    </div>

    <!-- 3. Department Status List Toolbar -->
  <div class="space-y-2 pt-1">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1.5 text-xs font-bold text-slate-200">
        <i data-lucide="list-checks" class="w-4 h-4 text-sky-400"></i>
        <span>부서별 점호 현황 (그룹별 아코디언)</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleAllGroups(true)" class="text-[11px] text-sky-400 hover:text-sky-300 font-medium">전체 펼침</button>
        <span class="text-slate-600 text-xs">|</span>
        <button onclick="toggleAllGroups(false)" class="text-[11px] text-slate-400 hover:text-slate-300 font-medium">전체 축소</button>
      </div>
    </div>

    <!-- Quick Filter Pills -->
    <div class="grid grid-cols-4 gap-1 p-1 bg-slate-900 border border-slate-800 rounded-xl text-[11px]">
      <button onclick="setFilter('unreported')" id="filterTabUnreported" class="py-1.5 rounded-lg font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40 transition">
        미보고 (<span id="countPillUnreported">0</span>)
      </button>
      <button onclick="setFilter('missing')" id="filterTabMissing" class="py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition">
        잔류자 (<span id="countPillMissing">0</span>)
      </button>
      <button onclick="setFilter('complete')" id="filterTabComplete" class="py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition">
        완료 (<span id="countPillComplete">0</span>)
      </button>
      <button onclick="setFilter('all')" id="filterTabAll" class="py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition">
        전체 (<span id="countPillAll">0</span>)
      </button>
    </div>

    <!-- Quick Search Input -->
    <div class="relative">
      <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-2.5"></i>
      <input type="text" id="deptSearchInput" placeholder="부서명/본부명 검색 (예: SYSTEM, SEC, CS, 제조)" 
        class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
    </div>
  </div>

  <!-- Department List Cards (Grouped Accordion) -->
  <div id="deptGroupContainer" class="space-y-3">
    <!-- Injected dynamically by groups -->
  </div>

</main>

  <!-- 119 Handover Briefing Modal (Mobile Optimized) -->
  <div id="briefingModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl max-w-lg w-full p-4 shadow-2xl space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <div class="flex items-center gap-1.5 text-amber-400 font-bold text-sm">
          <i data-lucide="shield" class="w-4 h-4"></i>
          <span>119 소방대 현장 인계 브리핑</span>
        </div>
        <button onclick="closeModal('briefingModal')" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="text-[11px] text-slate-400">소방대장 도착 시 본 내용을 그대로 보고하거나 카톡으로 인계할 수 있습니다.</p>
      <div id="briefingContent" class="bg-black/60 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 whitespace-pre-line leading-relaxed max-h-60 overflow-y-auto">
        <!-- Dynamically Generated -->
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="copyBriefingText()" class="px-3.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs flex items-center gap-1.5 transition active:scale-95">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span id="copyBtnLabel">브리핑 복사</span>
        </button>
        <button onclick="closeModal('briefingModal')" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal (Sheet URL & Polling) -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-4 shadow-2xl space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <div class="flex items-center gap-1.5 text-sky-400 font-bold text-sm">
          <i data-lucide="sliders" class="w-4 h-4"></i>
          <span>관제 연동 설정</span>
        </div>
        <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-300 mb-1">구글 시트 웹앱 URL 또는 CSV URL</label>
          <input type="text" id="sheetUrlInput" placeholder="https://script.google.com/... 또는 구글시트 CSV 링크" 
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-slate-200 text-xs focus:outline-none focus:border-sky-500 font-mono">
        </div>
        <div>
          <label class="block font-semibold text-slate-300 mb-1">자동 동기화 주기</label>
          <select id="syncIntervalSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-slate-200 text-xs focus:outline-none focus:border-sky-500">
            <option value="3000">3초마다 갱신 (훈련 권장)</option>
            <option value="5000" selected>5초마다 갱신 (기본)</option>
            <option value="10000">10초마다 갱신</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="saveSettings()" class="px-3.5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition active:scale-95">
          저장 및 동기화
        </button>
        <button onclick="closeModal('settingsModal')" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium">
          취소
        </button>
      </div>
    </div>
  </div>

  <!-- Custom Mobile Toast Feedback -->
  <div id="toast" class="fixed bottom-5 inset-x-4 max-w-sm mx-auto z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-800/95 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl shadow-2xl flex items-center justify-center gap-2 text-xs">
    <i data-lucide="info" class="w-4 h-4 text-sky-400" id="toastIcon"></i>
    <span id="toastMessage">알림 메시지</span>
  </div>

  <script>
  // 부서 목록 정의: 실제 조직 체계 반영 (총 19개 부서/조직)
  const STANDARD_DEPARTMENTS = [
    // [SYSTEM본부] (6개)
    { id: "SYS_1", group: "SYSTEM본부", name: "[SYSTEM본부] SEC영업팀" },
    { id: "SYS_2", group: "SYSTEM본부", name: "[SYSTEM본부] SKH영업팀" },
    { id: "SYS_3", group: "SYSTEM본부", name: "[SYSTEM본부] CS팀(CS1G,CS2G)" },
    { id: "SYS_4", group: "SYSTEM본부", name: "[SYSTEM본부] 제조팀(설비기술G)" },
    { id: "SYS_5", group: "SYSTEM본부", name: "[SYSTEM본부] 생산기술팀(기구G,제어G,TSG)" },
    { id: "SYS_6", group: "SYSTEM본부", name: "[SYSTEM본부] 품질G" },

    // [연구소] (3개)
    { id: "LAB_1", group: "연구소", name: "[연구소] 신제품개발G" },
    { id: "LAB_2", group: "연구소", name: "[연구소] 연구기술G" },
    { id: "LAB_3", group: "연구소", name: "[연구소] 정제기TF" },

    // [경영지원본부] (4개)
    { id: "MGT_1", group: "경영지원본부", name: "[경영지원본부] 기획팀(EPC원가관리G)" },
    { id: "MGT_2", group: "경영지원본부", name: "[경영지원본부] 재무팀(회계G,자금G)" },
    { id: "MGT_3", group: "경영지원본부", name: "[경영지원본부] 구매팀" },
    { id: "MGT_4", group: "경영지원본부", name: "[경영지원본부] 준법G" },

    // [인사본부] (3개)
    { id: "HR_1", group: "인사본부", name: "[인사본부] PEOPLE팀" },
    { id: "HR_2", group: "인사본부", name: "[인사본부] CULTURE팀" },
    { id: "HR_3", group: "인사본부", name: "[인사본부] 정보전략팀" },

    // 직속 조직 (2개)
    { id: "DIR_1", group: "직속 조직", name: "안전환경팀(안전관리G)" },
    { id: "DIR_2", group: "직속 조직", name: "글로벌사업개발팀" },

    // 경영진 (1개 - PEOPLE팀 점호 대행)
    { id: "EXEC",  group: "경영진",   name: "[경영진] CEO,COO,본부장 (PEOPLE팀 대행)" }
  ];

  // Global State
  let currentFilter = 'all'; // 그룹 확인이 쉽도록 초기값 'all' 또는 'unreported'
  let searchQuery = '';
  let isDemoMode = true;
  let pollInterval = 5000;
  let syncTimer = null;
  let drillStartTime = Date.now();
  let sheetUrl = localStorage.getItem('eoc_sheet_url') || '';

  // 그룹 아코디언 상태 관리 (기본값: false - 축소 상태)
  let groupExpandedState = {};

  // Data Map: Key = Department Name (최신 제출 덮어쓰기)
  let departmentRecords = {};

  // 모의 테스트용 데이터 (실제 부서명 기준 샘플)
  const MOCK_SUBMISSIONS = [
    { dept: "[SYSTEM본부] SEC영업팀", submitter: "김영업", eTotal: 12, eDone: 12, gTotal: 1, gDone: 1, note: "고객사 미팅객 1명 동반 대피 완료", time: "14:02:40" },
    { dept: "[SYSTEM본부] CS팀(CS1G,CS2G)", submitter: "박씨에스", eTotal: 26, eDone: 25, gTotal: 2, gDone: 2, note: "CS2G 1명(정대리) 2층 휴게실 잔류 확인 중", time: "14:04:15" },
    { dept: "[SYSTEM본부] 제조팀(설비기술G)", submitter: "최설비", eTotal: 30, eDone: 30, gTotal: 4, gDone: 4, note: "라인 셧다운 조치 후 전원 대피", time: "14:04:55" },
    { dept: "[SYSTEM본부] 생산기술팀(기구G,제어G,TSG)", submitter: "정생기", eTotal: 18, eDone: 18, gTotal: 0, gDone: 0, note: "전원 옥외 집결 완료", time: "14:03:30" },
    { dept: "[연구소] 신제품개발G", submitter: "조연구", eTotal: 14, eDone: 14, gTotal: 0, gDone: 0, note: "실험실 전원 차단 후 대피", time: "14:03:50" },
    { dept: "[경영지원본부] 재무팀(회계G,자금G)", submitter: "윤재무", eTotal: 9, eDone: 9, gTotal: 0, gDone: 0, note: "금고 시건 완료 후 대피", time: "14:03:15" },

    { dept: "안전환경팀(안전관리G)", submitter: "이안전", eTotal: 6, eDone: 6, gTotal: 0, gDone: 0, note: "소방 펌프실 및 SVP 수동 개방 점검", time: "14:01:50" },
    { dept: "[경영진] CEO,COO,본부장 (PEOPLE팀 대행)", submitter: "강인사(대행)", eTotal: 5, eDone: 5, gTotal: 0, gDone: 0, note: "CEO, COO 및 각 본부장 전원 집결 확인 완료", time: "14:02:50" }
  ];

  function loadMockData() {
    departmentRecords = {};
    MOCK_SUBMISSIONS.forEach(sub => {
      departmentRecords[sub.dept] = {
        dept: sub.dept,
        submitter: sub.submitter,
        eTotal: Number(sub.eTotal),
        eDone: Number(sub.eDone),
        gTotal: Number(sub.gTotal),
        gDone: Number(sub.gDone),
        note: sub.note,
        updatedAt: sub.time
      };
    });
    renderAll();
    showToast("모의 점호 데이터가 로드되었습니다.");
  }

    // 핵심 집계 및 미보고 부서 추출 로직
    function calculateMetrics() {
      let empTotal = 0, empDone = 0;
      let guestTotal = 0, guestDone = 0;
      let reportedCount = 0;
      let missingPersonDepts = [];
      let unreportedDepts = [];
      let completedDepts = [];

      STANDARD_DEPARTMENTS.forEach(std => {
        const rec = departmentRecords[std.name];
        if (rec) {
          reportedCount++;
          empTotal += rec.eTotal;
          empDone += rec.eDone;
          guestTotal += rec.gTotal;
          guestDone += rec.gDone;

          const eMiss = Math.max(0, rec.eTotal - rec.eDone);
          const gMiss = Math.max(0, rec.gTotal - rec.gDone);

          if (eMiss > 0 || gMiss > 0) {
            missingPersonDepts.push({ ...rec, eMiss, gMiss });
          } else {
            completedDepts.push(rec);
          }
        } else {
          unreportedDepts.push(std);
        }
      });

      const totalPeople = empTotal + guestTotal;
      const totalEvacuated = empDone + guestDone;
      const overallRate = totalPeople > 0 ? Math.round((totalEvacuated / totalPeople) * 100) : 0;
      const totalMissing = (empTotal - empDone) + (guestTotal - guestDone);

      return {
        empTotal, empDone, empMissing: Math.max(0, empTotal - empDone),
        guestTotal, guestDone, guestMissing: Math.max(0, guestTotal - guestDone),
        totalPeople, totalEvacuated, totalMissing,
        overallRate,
        reportedCount,
        totalDepts: STANDARD_DEPARTMENTS.length,
        unreportedDepts,
        missingPersonDepts,
        completedDepts
      };
    }

    function renderAll() {
      const metrics = calculateMetrics();

      // 1. 점호 취합 지표 표시
      document.getElementById('statOverallRate').innerText = `${metrics.overallRate}%`;
      document.getElementById('statOverallFraction').innerText = `(${metrics.totalEvacuated} / ${metrics.totalPeople}명)`;
      document.getElementById('statOverallBar').style.width = `${metrics.overallRate}%`;
      document.getElementById('statReportedRatio').innerText = `${metrics.reportedCount} / ${metrics.totalDepts}`;

      // 미확인 인원
      const totalMissingEl = document.getElementById('statTotalMissing');
      totalMissingEl.innerText = `${metrics.totalMissing}명`;
      if (metrics.totalMissing > 0) {
        totalMissingEl.className = "text-xl font-bold text-red-400 animate-pulse";
      } else {
        totalMissingEl.className = "text-xl font-bold text-emerald-400";
      }

      // 서브 카운터 (임직원 vs 협력사)
      document.getElementById('statEmpDone').innerText = metrics.empDone;
      document.getElementById('statEmpTotal').innerText = metrics.empTotal;
      const empBadge = document.getElementById('statEmpMissingBadge');
      if (metrics.empMissing > 0) {
        empBadge.innerText = `${metrics.empMissing}명 잔류`;
        empBadge.className = "text-[10px] font-bold text-red-400";
      } else {
        empBadge.innerText = `전원완료`;
        empBadge.className = "text-[10px] font-bold text-emerald-400";
      }

      document.getElementById('statGuestDone').innerText = metrics.guestDone;
      document.getElementById('statGuestTotal').innerText = metrics.guestTotal;
      const guestBadge = document.getElementById('statGuestMissingBadge');
      if (metrics.guestMissing > 0) {
        guestBadge.innerText = `${metrics.guestMissing}명 잔류`;
        guestBadge.className = "text-[10px] font-bold text-amber-400";
      } else {
        guestBadge.innerText = `확인완료`;
        guestBadge.className = "text-[10px] font-bold text-slate-400";
      }

      // 2. 미보고 부서 알림 영역 갱신
      renderUnreportedSection(metrics.unreportedDepts);

      // 필터 탭 숫자 갱신
    document.getElementById('countPillUnreported').innerText = metrics.unreportedDepts.length;
    document.getElementById('countPillMissing').innerText = metrics.missingPersonDepts.length;
    document.getElementById('countPillComplete').innerText = metrics.completedDepts.length;
    document.getElementById('countPillAll').innerText = metrics.totalDepts;

    // 3. 상위부서 그룹 아코디언 카드 렌더링
    renderDeptGroups();

    lucide.createIcons();
  }

    // 상위부서 단위 그룹 아코디언 렌더링
    function renderDeptGroups() {
      const container = document.getElementById('deptGroupContainer');
      container.innerHTML = '';

      const query = searchQuery.trim().toLowerCase();

      // 상위 그룹별로 부서 묶기
      const groupsMap = {};
      STANDARD_DEPARTMENTS.forEach(dept => {
        if (!groupsMap[dept.group]) {
          groupsMap[dept.group] = [];
        }
        groupsMap[dept.group].push(dept);
      });

      let totalVisibleGroups = 0;

      Object.keys(groupsMap).forEach(groupName => {
        const depts = groupsMap[groupName];

        // 필터 및 검색 조건에 맞는 부서 추출
        const filteredDepts = depts.filter(deptMeta => {
          const rec = departmentRecords[deptMeta.name];
          const isReported = !!rec;
          const eMiss = isReported ? Math.max(0, rec.eTotal - rec.eDone) : 0;
          const gMiss = isReported ? Math.max(0, rec.gTotal - rec.gDone) : 0;
          const hasMissing = isReported && (eMiss > 0 || gMiss > 0);

          if (query && !deptMeta.name.toLowerCase().includes(query) && !deptMeta.group.toLowerCase().includes(query)) {
            return false;
          }

          if (currentFilter === 'unreported' && isReported) return false;
          if (currentFilter === 'missing' && (!isReported || !hasMissing)) return false;
          if (currentFilter === 'complete' && (!isReported || hasMissing)) return false;

          return true;
        });

        // 표시할 하위 부서가 하나도 없으면 그룹 숨김
        if (filteredDepts.length === 0) return;
        totalVisibleGroups++;

        // 그룹 통계 계산

        let groupMissingPersons = 0;

        let groupTotal = 0;

            groupTotalReported++;
            groupEvac += (rec.eDone + rec.gDone);
            groupTotal += (rec.eTotal + rec.gTotal);
            const m = Math.max(0, (rec.eTotal - rec.eDone) + (rec.gTotal - rec.gDone));
            groupMissingPersons += m;
          }

        // 검색 중이거나 사용자가 펼친 경우 열기 (기본은 접힘)

    // Google Sheets 실시간 동기화
    async function fetchFromSheet() {
      if (!sheetUrl) return;

      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        let rows = [];
        try {
          rows = JSON.parse(text);
        } catch(e) {
          rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
        }

        if (!rows || rows.length <= 1) return;

        const newRecords = {};
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 5) continue;

          const timestamp = row[0] ? String(row[0]).split(' ')[1] || row[0] : '--:--';
          const dept = String(row[1]).trim();
          const submitter = String(row[2] || '담당자').trim();
          const eTotal = Number(row[3]) || 0;
          const eDone = Number(row[4]) || 0;
          const gTotal = Number(row[5]) || 0;
          const gDone = Number(row[6]) || 0;
          const note = row[7] ? String(row[7]).trim() : '-';

          if (!dept) continue;

          // 동일 부서 최신 덮어쓰기
          newRecords[dept] = { dept, submitter, eTotal, eDone, gTotal, gDone, note, updatedAt: timestamp };
        }

        departmentRecords = newRecords;
        renderAll();
      } catch (err) {
        console.error("Sheet polling failed:", err);
      }
    }

      if (syncTimer) clearInterval(syncTimer);
      if (!isDemoMode && sheetUrl) {
        fetchFromSheet();
        syncTimer = setInterval(fetchFromSheet, pollInterval);
      }
    }

    function initTimers() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString('ko-KR');

        const elapsedSec = Math.floor((Date.now() - drillStartTime) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');
        document.getElementById('incidentTimer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    window.onload = function() {
      initTimers();

      // Events
      document.getElementById('openBriefingBtn').addEventListener('click', openBriefingModal);
      document.getElementById('openSettingsBtn').addEventListener('click', () => {
        document.getElementById('sheetUrlInput').value = sheetUrl;
        document.getElementById('settingsModal').classList.remove('hidden');
      });

      document.getElementById('deptSearchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderDeptGroups();
        lucide.createIcons();
      });

      document.getElementById('toggleDemoBtn').addEventListener('click', () => {
        isDemoMode = !isDemoMode;
        if (isDemoMode) {
          document.getElementById('demoModeLabel').innerText = "모의 데이터";
          loadMockData();
        } else {
          document.getElementById('demoModeLabel').innerText = "실제 시트 대기";
          departmentRecords = {};
          renderAll();
          if (sheetUrl) restartSync();
          showToast("실제 시트 수신 모드로 전환되었습니다.");
        }
      });

      if (sheetUrl) {
        isDemoMode = false;
        document.getElementById('demoModeLabel').innerText = "실제 시트 연동";
        restartSync();
      } else {
        loadMockData();
      }

      lucide.createIcons();
    };
  </script>
</body>
</html>
